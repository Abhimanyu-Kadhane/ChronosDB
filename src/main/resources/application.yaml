spring:
  application:
    name: ChronosDB
  datasource:
    url: jdbc:mysql://localhost:3306/chronosdb?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USER:chronos}
    password: ${DB_PASS:chronos}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

chronosdb:
  snapshot:
    interval-versions: 10       # Snapshot every N versions
  integrity:
    verify-on-read: true        # SHA-256 check on every time-travel read